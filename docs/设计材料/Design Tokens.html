<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Tokens · 本地音乐播放器</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="player.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: oklch(0.962 0.004 85);
  color: oklch(0.24 0.006 80);
  -webkit-font-smoothing: antialiased;
  padding: 56px 28px 80px;
}
code, .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
.wrap { max-width: 1120px; margin: 0 auto; }
.page-head { margin-bottom: 44px; }
.page-kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); margin-bottom: 10px; }
.page-title { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
.page-sub { font-size: 14px; color: oklch(0.5 0.02 280); margin-top: 8px; line-height: 1.7; }
.page-sub a { color: var(--accent); text-decoration: none; font-weight: 600; }
.page-sub a:hover { text-decoration: underline; }
.tok-section { margin-top: 52px; }
.sec-title { font-size: 19px; font-weight: 700; letter-spacing: -0.2px; }
.sec-sub { font-size: 13px; color: oklch(0.5 0.02 280); margin-top: 4px; margin-bottom: 18px; }
.theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 880px) { .theme-grid { grid-template-columns: 1fr; } }
.tpanel {
  background: var(--win-bg); color: var(--text);
  border-radius: 16px; padding: 22px;
  box-shadow: 0 0 0 1px var(--sep), 0 10px 30px oklch(0 0 0 / 0.07);
}
.tpanel-label { font-size: 12px; font-weight: 700; color: var(--text-3); letter-spacing: 0.08em; margin-bottom: 16px; }
.sw { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
.sw-chip {
  width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
  box-shadow: inset 0 0 0 1px var(--sep);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700;
}
.sw-meta { min-width: 0; }
.sw-name { font-size: 13px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sw-name code { font-size: 11px; color: var(--text-3); font-weight: 500; }
.sw-val { font-size: 11px; color: var(--text-2); display: block; margin-top: 2px; }
.card {
  background: #fff; border-radius: 16px; padding: 22px;
  box-shadow: 0 0 0 1px oklch(0.3 0.03 280 / 0.1), 0 10px 30px oklch(0 0 0 / 0.06);
}
.type-row { display: flex; align-items: baseline; gap: 24px; padding: 14px 0; border-bottom: 1px solid oklch(0.3 0.03 280 / 0.08); }
.type-row:last-child { border-bottom: none; }
.type-sample { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.type-spec { width: 220px; flex-shrink: 0; font-size: 11.5px; color: oklch(0.5 0.02 280); }
.type-spec b { color: oklch(0.3 0.02 280); font-size: 12.5px; display: block; margin-bottom: 1px; }
.radii-grid, .space-grid, .icon-grid, .album-grid { display: grid; gap: 16px; }
.radii-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.radius-demo { width: 64px; height: 64px; background: var(--accent-soft); border: 1.5px solid var(--accent); margin-bottom: 10px; }
.tok-item-name { font-size: 12.5px; font-weight: 600; }
.tok-item-val { font-size: 11px; color: oklch(0.55 0.02 280); margin-top: 2px; }
.space-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); align-items: end; }
.space-bar { background: var(--accent); border-radius: 3px; height: 14px; margin-bottom: 8px; }
.icon-grid { grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); }
.icon-cell {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 16px 8px 12px; border-radius: 12px;
  background: oklch(0.97 0.005 282);
  box-shadow: inset 0 0 0 1px oklch(0.3 0.03 280 / 0.07);
  color: oklch(0.3 0.02 280);
}
.icon-cell.is-new { box-shadow: inset 0 0 0 1.5px var(--accent); }
.icon-name { font-size: 11px; color: oklch(0.5 0.02 280); text-align: center; line-height: 1.4; }
.icon-name code { font-size: 10px; color: oklch(0.65 0.015 280); display: block; }
.album-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.album-card { display: flex; flex-direction: column; gap: 8px; }
.album-chip { height: 84px; border-radius: 12px; box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.08); }
.demo-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 0; }
.demo-label { font-size: 11px; font-weight: 700; color: var(--text-3); width: 100%; margin-top: 10px; }
.demo-slider { width: 220px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="music-data.js"></script>
<script type="text/babel" src="player-ui.jsx"></script>
<script type="text/babel" src="tokens-page.jsx"></script>
</body>
</html>
